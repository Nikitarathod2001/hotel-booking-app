services:
  server:
    build:
      context: ./server
    container_name: hotel-server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_URL: http://54.159.61.252:5000
    container_name: hotel-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped